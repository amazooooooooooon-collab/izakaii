<div id="map"></div>

<div class="area-switcher">

</div>

<div class="filter-panel-container">
  <button id="filterToggle" class="filter-toggle-btn" onclick="toggleFilterPanel(event)">絞り込み・並び替え ▾</button>
  <div id="filterPanel" class="filter-panel">
    <div class="filter-section">
      <label class="filter-label">並び替え</label>
      <select id="sortSelect">
        <option value="default">デフォルト</option>
        <option value="rating">評価が高い順</option>
        <option value="reviews">レビュー数が多い順</option>
      </select>
    </div>
    <div class="filter-section">
      <label class="filter-label">予算感</label>
      <label class="checkbox-label"><input type="checkbox" class="price-checkbox" value="1" checked> 〜2,000円</label>
      <label class="checkbox-label"><input type="checkbox" class="price-checkbox" value="2" checked> 2,000〜4,000円</label>
      <label class="checkbox-label"><input type="checkbox" class="price-checkbox" value="3" checked> 4,000〜7,000円</label>
      <label class="checkbox-label"><input type="checkbox" class="price-checkbox" value="4" checked> 7,000円〜</label>
      <label class="checkbox-label"><input type="checkbox" class="price-checkbox" value="unknown" checked> 予算感不明</label>
    </div>
    <div class="filter-section">
      <label class="checkbox-label"><input type="checkbox" id="lateNightCheckbox"> 深夜営業ありのみ表示</label>
    </div>
  </div>
</div>

<button id="locateButton" class="locate-button" aria-label="現在地" onclick="locateMe()">

  const AREAS = {"新宿": {"lat": 35.6896, "lng": 139.6917, "zoom": 15}, "渋谷": {"lat": 35.658, "lng": 139.7016, "zoom": 15}, "全エリア": {"lat": 35.6738, "lng": 139.69665, "zoom": 13}};
  const DEFAULT_AREA = "新宿";
  const PRICE_LABELS = {"1": "〜2,000円", "2": "2,000〜4,000円", "3": "4,000〜7,000円", "4": "7,000円〜"};
  const PRICE_UNKNOWN_LABEL = "予算感不明";

  // Shared state the map, the filter/sort panel, and the area switcher all
  // read and write. `map`/`clusterer` are assigned once initMap() runs;
  // everything here can be wired up immediately since the DOM already exists.
  let map;
  let clusterer;
  let markersWithData = [];
  let currentArea = DEFAULT_AREA;
  let sortMode = 'default';
  let priceFilter = new Set([...Object.keys(PRICE_LABELS), 'unknown']);
  let lateNightOnly = false;
  let currentLocationMarker = null;

  function toggleFabMenu(event) {
    if (event) event.stopPropagation();
    document.getElementById('fabMenu').classList.toggle('open');
  }

  function toggleFilterPanel(event) {
    if (event) event.stopPropagation();
    document.getElementById('filterPanel').classList.toggle('open');
  }

  document.addEventListener('click', function (event) {
    const fabContainer = document.querySelector('.fab-container');
    if (fabContainer && !fabContainer.contains(event.target)) {
      document.getElementById('fabMenu').classList.remove('open');
    }
    const filterContainer = document.querySelector('.filter-panel-container');
    if (filterContainer && !filterContainer.contains(event.target)) {
      document.getElementById('filterPanel').classList.remove('open');
    }
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function priceKey(p) {
    return (p.priceLevel === null || p.priceLevel === undefined) ? 'unknown' : String(p.priceLevel);
  }

  function priceLabel(p) {
    return PRICE_LABELS[priceKey(p)] || PRICE_UNKNOWN_LABEL;
  }

  function isVisible(p) {
    if (currentArea !== '全エリア' && p.area !== currentArea) return false;
    if (!priceFilter.has(priceKey(p))) return false;
    if (lateNightOnly && !p.lateNight) return false;
    return true;
  }

  // Re-derives which markers should be on the map from the current
  // area/price/late-night state and hands the subset to the clusterer.
  // Nothing is re-created here, so this stays fast even with 1000+ markers.
  function applyFilters() {
    if (!clusterer) return;
    const visible = markersWithData.filter(function (item) {
      return isVisible(item.p);
    }).map(function (item) { return item.marker; });
    clusterer.clearMarkers();
    clusterer.addMarkers(visible);
    // Freshly built markers already have no z-index override, so re-running
    // applySort()'s "default" branch here would just be a synchronous
    // 1000+ iteration no-op — exactly the kind of long task that starves
    // tile rendering on first load. Only bother when a real sort is active.
    if (sortMode !== 'default') {
      applySort();
    }
  }

  // Sorting a map (rather than a list) is expressed as stacking order: the
  // "top" of the chosen ordering renders above everything else when pins
  // overlap. "デフォルト" clears the override back to insertion order.
  function applySort() {
    if (sortMode === 'default') {
      markersWithData.forEach(function (item) { item.marker.setZIndex(null); });
      return;
    }
    const sorted = markersWithData.slice().sort(function (a, b) {
      if (sortMode === 'rating') {
        return (parseFloat(b.p.rating) || 0) - (parseFloat(a.p.rating) || 0);
      }
      return (parseInt(b.p.reviews, 10) || 0) - (parseInt(a.p.reviews, 10) || 0);
    });
    sorted.forEach(function (item, i) {
      item.marker.setZIndex(sorted.length - i);
    });
  }

  function switchArea(area) {
    currentArea = area;
    document.querySelectorAll('.area-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.area === area);
    });
    const center = AREAS[area];
    if (map && center) {
      map.setCenter({ lat: center.lat, lng: center.lng });
      map.setZoom(center.zoom);
    }
    applyFilters();
  }

  function setupFilterControls() {
    document.querySelectorAll('.price-checkbox').forEach(function (cb) {
      cb.addEventListener('change', function () {
        priceFilter = new Set(
          [...document.querySelectorAll('.price-checkbox:checked')].map(function (c) { return c.value; })
        );
        applyFilters();
      });
    });
    document.getElementById('lateNightCheckbox').addEventListener('change', function (e) {
      lateNightOnly = e.target.checked;
      applyFilters();
    });
    document.getElementById('sortSelect').addEventListener('change', function (e) {
      sortMode = e.target.value;
      applySort();
    });
  }
  setupFilterControls();

  function locateMe() {
    if (!navigator.geolocation) {
      alert('この端末は位置情報の取得に対応していません');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (currentLocationMarker) {
          currentLocationMarker.setPosition(loc);
        } else {
          currentLocationMarker = new google.maps.Marker({
            position: loc,
            map: map,
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8,
              fillColor: '#4285F4',
              fillOpacity: 1,
              strokeColor: '#ffffff',
              strokeWeight: 2
            },
            zIndex: 9999,
            title: '現在地'
          });
        }
        map.setCenter(loc);
        map.setZoom(16);
      },
      function (err) {
        alert('現在地を取得できませんでした: ' + err.message);
      }
    );
  }

  function initMap() {
    const areaCenter = AREAS[DEFAULT_AREA];
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: areaCenter.lat, lng: areaCenter.lng },
      zoom: areaCenter.zoom,
      // Individually toggling streetView/fullscreen/pan/mapType/rotate/camera
      // controls turned into whack-a-mole as Google adds new default UI over
      // time. Disabling everything and opting back into just zoomControl is
      // the version-proof way to keep only the buttons we actually want.
      disableDefaultUI: true,
      zoomControl: true,
      zoomControlOptions: {
        position: google.maps.ControlPosition.LEFT_BOTTOM
      }
    });

    const infoWindow = new google.maps.InfoWindow();

    // CSS alone couldn't reliably beat Google's own same-specificity rules on
    // .gm-style-iw-d / .gm-style-iw-c, so trim the padding imperatively once
    // Google has finished building the InfoWindow's DOM for this open() call.
    infoWindow.addListener('domready', function () {
      const iwD = document.querySelector('.gm-style-iw-d');
      if (iwD) {
        iwD.style.padding = '0';
        iwD.style.overflow = 'hidden';
      }
      const iwC = document.querySelector('.gm-style-iw-c');
      if (iwC) {
        iwC.style.padding = '12px';
      }
      // The close (x) button lives in its own header row (.gm-style-iw-chr),
      // which reserves vertical space above the content independently of the
      // iw-d/iw-c padding above. Collapse that row out of the layout flow and
      // pin the button to the corner directly so it doesn't push content down.
      const iwChr = document.querySelector('.gm-style-iw-chr');
      if (iwChr) {
        iwChr.style.position = 'absolute';
        iwChr.style.top = '2px';
        iwChr.style.right = '2px';
        iwChr.style.height = '0';
        iwChr.style.zIndex = '1';
      }
    });

    // Building 1000+ Markers in a single synchronous pass is a long enough
    // task to starve the map's own tile rendering (confirmed: a 100-place
    // build renders fine, the full ~1130-place set does not). Split marker
    // construction into small batches across separate macrotasks so the
    // browser gets to paint tiles in between instead of one giant blocking loop.
    const BATCH_SIZE = 150;
    let buildIndex = 0;

    function buildNextBatch() {
      const end = Math.min(buildIndex + BATCH_SIZE, places.length);
      for (; buildIndex < end; buildIndex++) {
        const p = places[buildIndex];
        const marker = new google.maps.Marker({
          position: { lat: p.lat, lng: p.lng },
          title: p.name
        });

        let popupHtml =
          '<div class="popup-name">' + escapeHtml(p.name) + '</div>' +
          '<div class="popup-row">評価: ' + escapeHtml(p.rating || '-') + '</div>' +
          '<div class="popup-row">予算感: ' + escapeHtml(priceLabel(p)) + '</div>' +
          '<div class="popup-row">住所: ' + escapeHtml(p.address || '-') + '</div>' +
          '<div class="popup-row">レビュー数: ' + escapeHtml(p.reviews || '-') + '</div>';
        if (p.url && p.url.indexOf('http') === 0) {
          popupHtml += '<div class="popup-row"><a href="' + escapeHtml(p.url) +
            '" target="_blank" rel="noopener noreferrer">Googleマップで見る</a></div>';
        }

        marker.addListener('click', function () {
          infoWindow.setContent(popupHtml);
          infoWindow.open(map, marker);
        });

        markersWithData.push({ p: p, marker: marker });
      }

      if (buildIndex < places.length) {
        setTimeout(buildNextBatch, 0);
      } else {
        // Start with no markers registered; applyFilters() below adds back
        // exactly the subset matching the default area/price/late-night state.
        // Deferred one more tick so it's not part of the same long task as
        // this final marker-building batch.
        clusterer = new markerClusterer.MarkerClusterer({ map, markers: [] });
        setTimeout(applyFilters, 0);
      }
    }

    setTimeout(buildNextBatch, 0);
  }
</script>
