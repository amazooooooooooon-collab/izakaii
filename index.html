  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function initMap() {
    const map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 35.6896, lng: 139.6917 },
      zoom: 15
    });

    const infoWindow = new google.maps.InfoWindow();

    const markers = places.map(function (p) {
      const marker = new google.maps.Marker({
        position: { lat: p.lat, lng: p.lng },
        title: p.name
      });

      let popupHtml =
        '<div class="popup-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="popup-row">評価: ' + escapeHtml(p.rating || '-') + '</div>' +
        '<div class="popup-row">住所: ' + escapeHtml(p.address || '-') + '</div>' +
        '<div class="popup-row">レビュー数: ' + escapeHtml(p.reviews || '-') + '</div>';
      if (p.url && p.url.indexOf('http') === 0) {
        popupHtml += '<div class="popup-row"><a href="' + escapeHtml(p.url) +
          '" target="_blank" rel="noopener noreferrer">Googleマップで見る</a></div>';
      }

      marker.addListener('click', function () {
        infoWindow.setContent(popupHtml);
        infoWindow.open(map, marker);
      });

      return marker;
    });

    new markerClusterer.MarkerClusterer({ map, markers });
  }
